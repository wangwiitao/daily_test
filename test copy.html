<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React + Ant Design Demo</title>

    <!-- 引入 React 和 ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- 引入 dayjs 日期处理库 -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>

    <!-- 引入 Ant Design 样式 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/antd@5.11.0/dist/reset.css"
    />

    <!-- 引入 Ant Design JS（使用CDN引入的稳定版本） -->
    <script src="https://unpkg.com/antd@5.11.0/dist/antd.min.js"></script>

    <!-- 引入 Babel Standalone 用于 JSX 转换 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.x/dist/index.umd.js"></script>

    <style>
      body {
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
              const { useRef, useEffect,useState } = React;

              // 从 antd 全局对象中解构所需组件
              const {
                Card,
                Table,
                Tag,
                Tabs,
                Row,
                Col,
                Progress,
                Typography,
                Space,
                Button,
                Collapse,
                Divider,
                Select,
                DatePicker,
              } = antd;


              const { Title, Text } = Typography;
              const { TabPane } = Tabs;
              const { Panel } = Collapse;
              const { Option } = Select;
              const { RangePicker } = DatePicker;
                // BU选项
      const buOptions = [
        { value: "all", label: "All BU" },
        { value: "palembang", label: "Palembang" },
        { value: "jambi", label: "Jambi" },
        { value: "riau", label: "Riau" },
        { value: "kalbar", label: "Kalbar" },
      ];

      // Region选项
      const regionOptions = [
        { value: "all", label: "All Region" },
        { value: "palembang-p1", label: "Palembang P1" },
        { value: "jambi", label: "Jambi" },
      ];

      // District选项
      const districtOptions = [
        { value: "all", label: "All District" },
        { value: "d", label: "D." },
        { value: "dsimp", label: "D.SIMP." },
      ];
        const [selectedRegion, setSelectedRegion] = useState("All Region");
  const [selectedDistrict, setSelectedDistrict] = useState("All District");

              function App() {
                const [message, setMessage] = React.useState("Hello Ant Design!");
                const [visible, setVisible] = React.useState(true);
                console.log("rerender");

                return (
                  <>
                    <SilviculturePlanting/>
                  </>
                );
              }

              function Test() {
                const inputRef = useRef();
                useEffect(() => {
                  inputRef.current.focus();
                });

                return <input ref={inputRef} />;
              }
              function SilviculturePlanting() {
                const [activeTab, setActiveTab] = useState('All BU');
          const [expandedFilters, setExpandedFilters] = useState(false);

          // 表格数据
          const dataSource = [
            {
              key: '1',
              serial: 1,
              spk: '5122732502',
              timeDuration: 0.89,
              bu: 'Palembang',
              region: 'Palembang P1',
              district: 'D.'
            },
            {
              key: '2',
              serial: 2,
              spk: '5122696020',
              timeDuration: 0.68,
              bu: 'Palembang',
              region: 'Palembang P1',
              district: 'D.SIMP.'
            },
            {
              key: '3',
              serial: 3,
              spk: '5122715557',
              timeDuration: 0.55,
              bu: 'Jambi',
              region: 'Jambi',
              district: ''
            }
          ];

          // 表格列定义
          const columns = [
            {
              title: 'Seria...',
              dataIndex: 'serial',
              key: 'serial',
              width: 80
            },
            {
              title: 'SPK',
              dataIndex: 'spk',
              key: 'spk',
              width: 120
            },
            {
              title: 'Time Duration',
              dataIndex: 'timeDuration',
              key: 'timeDuration',
              render: (value: number) => (
                <Tag color={value > 0.8 ? 'red' : value > 0.6 ? 'orange' : 'green'}>
                  {value} Day/Ha
                </Tag>
              ),
              width: 120
            },
            {
              title: 'BU',
              dataIndex: 'bu',
              key: 'bu',
              width: 100
            },
            {
              title: 'Region',
              dataIndex: 'region',
              key: 'region',
              width: 120
            },
            {
              title: 'District',
              dataIndex: 'district',
              key: 'district',
              width: 100
            }
          ];

          // 时间对比数据
          const timeComparisonData = [
            { method: 'Manual', region: 'Kalbar', value: 0.89 },
            { method: 'Manual', region: 'Palembang', value: 0.75 },
            { method: 'Manual', region: 'Riau', value: 0.65 },
            { method: 'Manual', region: 'Jambi', value: 0.55 },
            { method: 'Manual', region: 'Kaleng', value: 0.70 }
          ];

          // 筛选器数量
          const filterCount = 0;
          const totalFilters = 6;

          return (
            <div style={{ padding: '20px', backgroundColor: '#f0f2f5' }}>
              {/* 标题 */}
              <Card
                style={{ marginBottom: 20, backgroundColor: '#fff' }}
                bodyStyle={{ padding: '16px 24px' }}
              >
                <Title level={2} style={{ margin: 0 }}>
                  Silviculture-Planting
                </Title>
              </Card>

              {/* 顶部标签页 */}
              <Card style={{ marginBottom: 20 }}>
               <Col flex="auto">
                <Row gutter={16}>
                  <Col span={8}>
                    <Select
                      style={{ width: "100%" }}
                      placeholder="Select BU"
                      value={
                        activeTab === "All BU" ? "all" : activeTab.toLowerCase()
                      }
                      onChange={(value) =>
                        setActiveTab(
                          value === "all"
                            ? "All BU"
                            : value.charAt(0).toUpperCase() + value.slice(1),
                        )
                      }

                    >
                      {buOptions.map((option) => (
                        <Option key={option.value} value={option.value}>
                          {option.label}
                        </Option>
                      ))}
                    </Select>
                  </Col>

                  <Col span={8}>
                    <Select
                      style={{ width: "100%" }}
                      placeholder="Select Region"
                      value={selectedRegion}
                      onChange={setSelectedRegion}

                    >
                      {regionOptions.map((option) => (
                        <Option key={option.value} value={option.value}>
                          {option.label}
                        </Option>
                      ))}
                    </Select>
                  </Col>

                  <Col span={8}>
                    <Select
                      style={{ width: "100%" }}
                      placeholder="Select District"
                      value={selectedDistrict}
                      onChange={setSelectedDistrict}

                    >
                      {districtOptions.map((option) => (
                        <Option key={option.value} value={option.value}>
                          {option.label}
                        </Option>
                      ))}
                    </Select>
                  </Col>
                </Row>
              </Col>
              </Card>

              <Row gutter={[20, 20]}>
                {/* 左侧区域 */}
                <Col span={16}>
                  {/* 标准种植和道路可用性 */}
                  <Row gutter={[20, 20]}>
                    <Col span={12}>
                      <Card title="Standard Stocking" size="small">
                        <div style={{ padding: '10px 0' }}>
                          <Progress
                            percent={85}
                            strokeColor="#52c41a"
                            format={() => '85%'}
                          />
                          <Text type="secondary">Current Stocking Level</Text>
                        </div>
                      </Card>
                    </Col>
                    <Col span={12}>
                      <Card title="Road Availability" size="small">
                        <div style={{ padding: '10px 0' }}>
                          <Progress
                            percent={92}
                            strokeColor="#1890ff"
                            format={() => '92%'}
                          />
                          <Text type="secondary">Accessible Roads</Text>
                        </div>
                      </Card>
                    </Col>
                  </Row>

                  {/* 时间对比 */}
                  <Card
                    title={
                      <Space>

                        <span>Time Duration Compare</span>
                      </Space>
                    }
                    style={{ marginTop: 20 }}
                  >
                    <div style={{ marginBottom: 16 }}>
                      <Text strong>Manual</Text>
                      <div style={{ marginTop: 8 }}>
                        {timeComparisonData.map((item, index) => (
                          <div key={index} style={{
                            display: 'flex',
                            justifyContent: 'space-between',
                            padding: '4px 0',
                            borderBottom: index < 4 ? '1px solid #f0f0f0' : 'none'
                          }}>
                            <Text>{item.region}</Text>
                            <Text>{item.value} Day/Ha</Text>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div>
                      <Text strong>Machine</Text>
                      <Text type="secondary" style={{ marginLeft: 8 }}>Data not available</Text>
                    </div>
                  </Card>

                  {/* 数据表格 */}
                  <Card
                    style={{ marginTop: 20 }}
                    bodyStyle={{ padding: 0 }}
                  >
                    <Table
                      dataSource={dataSource}
                      columns={columns}
                      pagination={false}
                      size="small"
                    />
                  </Card>
                </Col>

                {/* 右侧区域 */}
                <Col span={8}>
                  {/* 筛选器展开 */}
                  <Card
                    title={
                      <Space>

                        <span>Filters</span>
                        <Tag>{filterCount}/{totalFilters}</Tag>
                      </Space>
                    }
                    extra={
                      <Button
                        type="text"

                        onClick={() => setExpandedFilters(!expandedFilters)}
                      />
                    }
                  >
                    <Collapse
                      bordered={false}
                      activeKey={expandedFilters ? ['1'] : []}
                    >
                      <Panel
                        header="Expand for more filters"
                        key="1"
                        showArrow={false}
                      >
                        <Space direction="vertical" style={{ width: '100%' }}>
                          <div>
                            <Text strong>Time Duration</Text>
                            <div style={{ marginTop: 8 }}>
                              <Select style={{ width: '100%' }} defaultValue="manual">
                                <Option value="manual">Manual</Option>
                                <Option value="machine">Machine</Option>
                              </Select>
                            </div>
                          </div>

                          <div>
                            <Text strong>Product</Text>
                            <Select style={{ width: '100%' }} placeholder="Select product" />
                          </div>

                          <div>
                            <Text strong>Date Range</Text>
                            <RangePicker style={{ width: '100%', marginTop: 8 }} />
                          </div>

                          <Button type="primary" block>
                            Apply Filters
                          </Button>
                        </Space>
                      </Panel>
                    </Collapse>
                  </Card>

                  {/* 统计分析 */}
                  <Card
                    title="Performance Analysis"
                    style={{ marginTop: 20 }}
                  >
                    <Space direction="vertical" size="middle" style={{ width: '100%' }}>
                      <div>
                        <Text strong>Manual Method Analysis</Text>
                        <div style={{ marginTop: 8, padding: 12, backgroundColor: '#fff7e6', borderRadius: 6 }}>
                          <Text type="warning">
                            Exceeding the mean by 0.3016 days.
                            This reflects the slowest planting process under the Manual method,
                            indicating potential operational inefficiencies or constraints.
                          </Text>
                        </div>
                      </div>

                      <Divider />

                      {/* 时间戳 */}
                      <div>
                        <Text strong>Last Updated</Text>
                        <div style={{ marginTop: 8 }}>
                          <Space direction="vertical" size="small">
                            <div>

                              <Text>2025-11-07 17:53:07</Text>
                            </div>
                            <div>
                              <Text type="secondary">test</Text>
                            </div>
                            <div>

                              <Text>2025-11-07 17:53:07</Text>
                            </div>
                          </Space>
                        </div>
                      </div>

                      {/* 扩展按钮 */}
                      <Button
                        type="dashed"
                        block

                        onClick={() => console.log('Expand clicked')}
                      >
                        Expand
                      </Button>
                    </Space>
                  </Card>
                </Col>
              </Row>
            </div>
          );}
              // 渲染应用
              const root = ReactDOM.createRoot(document.getElementById("root"));
              root.render(<App />);
    </script>
  </body>
</html>
